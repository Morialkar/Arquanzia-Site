name: CI

on:
  pull_request:
  workflow_dispatch:
  # Appelé par le workflow de déploiement : les tests gardent la porte de la production.
  # Pas de déclencheur « push sur main » ici, sinon la suite tournerait deux fois par push.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: arquanzia-backend

jobs:
  test:
    name: Tests et style
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          # Même version que le serveur, forcée par public/.htaccess. Le poste de
          # développement tourne sur une version plus récente : c'est la CI qui fait foi.
          php-version: '8.4'
          extensions: mbstring, zip, gd, sqlite3, pdo_sqlite, dom, fileinfo
          coverage: none

      - name: Cache des dépendances Composer
        uses: actions/cache@v4
        with:
          path: arquanzia-backend/vendor
          key: composer-${{ runner.os }}-php8.4-${{ hashFiles('arquanzia-backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php8.4-

      - name: Installer les dépendances
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Préparer l'environnement de test
        # Les tests tournent sur SQLite en mémoire (phpunit.xml) : aucune base externe
        # n'est nécessaire, mais Laravel exige une clé d'application.
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Vérifier le style (Pint)
        run: ./vendor/bin/pint --test

      - name: Lancer la suite de tests
        run: php artisan test
