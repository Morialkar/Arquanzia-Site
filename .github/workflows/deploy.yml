name: Déploiement

on:
  push:
    branches: [main]
  workflow_dispatch:

# Un seul déploiement à la fois, et on ne l'annule jamais en cours de route : couper un
# rsync ou une migration à mi-parcours laisserait le serveur dans un état incohérent.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    name: Tests et style
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Déployer en production
    needs: test
    runs-on: ubuntu-latest
    # Pour exiger une approbation manuelle avant chaque mise en production, créer un
    # environnement « production » dans les réglages du dépôt et ajouter ici :
    #   environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Installer Node et construire les assets
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: arquanzia-backend/package-lock.json

      - name: Construire les assets
        # public/build n'est pas versionné : il est fabriqué ici, puis synchronisé avec le
        # reste. Le serveur mutualisé n'a pas Node, la construction ne peut pas s'y faire.
        working-directory: arquanzia-backend
        run: |
          npm ci
          npm run build

      - name: Préparer la connexion SSH
        env:
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          # Un alias décrit la cible une bonne fois : les étapes suivantes n'ont plus à
          # répéter les options, et ne peuvent plus diverger entre elles.
          #
          # IdentitiesOnly est le point décisif. L'option -i *ajoute* une clé à la liste des
          # identités proposées, elle n'y restreint pas : le client offrait aussi les clés
          # par défaut et celles de l'agent, et le serveur coupait la connexion à sa limite
          # MaxAuthTries avec « Too many authentication failures ».
          cat > ~/.ssh/config <<EOF
          Host cible
            HostName $SSH_HOST
            User $SSH_USER
            Port $SSH_PORT
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            BatchMode yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Vérifier l'accès au serveur
        # Étape de diagnostic : sans elle, un problème d'authentification se manifeste au
        # milieu d'un rsync et son message se perd dans la sortie du transfert.
        run: ssh cible 'echo "Connexion SSH établie sur $(hostname)"'

      - name: Synchroniser les fichiers
        env:
          REMOTE_DIR: ${{ secrets.DEPLOY_PATH }}
        run: |
          rsync -az --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='node_modules' \
            --exclude='vendor' \
            --exclude='storage' \
            --exclude='bootstrap/cache' \
            --exclude='tests' \
            --exclude='.DS_Store' \
            arquanzia-backend/ "cible:$REMOTE_DIR/"

      - name: Installer les dépendances, migrer et régénérer les caches
        env:
          REMOTE_DIR: ${{ secrets.DEPLOY_PATH }}
          PHP_BIN: ${{ secrets.DEPLOY_PHP_BIN }}
        run: |
          ssh cible \
            "set -e
             cd '$REMOTE_DIR'

             # Impératif AVANT composer : les caches de découverte listent les service
             # providers des paquets installés. Quand un paquet disparaît du composer.lock,
             # Laravel tente quand même de charger le sien pendant la désinstallation, ne le
             # trouve plus, et interrompt tout. Ces fichiers sont tous régénérés plus bas.
             rm -f bootstrap/cache/*.php

             '$PHP_BIN' \$(which composer) install --no-dev --optimize-autoloader --no-interaction
             '$PHP_BIN' artisan migrate --force
             '$PHP_BIN' artisan view:clear
             '$PHP_BIN' artisan cache:clear
             '$PHP_BIN' artisan config:cache
             '$PHP_BIN' artisan route:cache
             chmod -R 775 storage bootstrap/cache"

      - name: Vérifier que le site répond
        run: |
          # La vérification se fait DEPUIS le serveur, pas depuis Internet.
          #
          # La vérification part DU serveur, pas d'Internet : le domaine arquanzia.com a
          # expiré, le site est servi depuis arquanzia.site, et la propagation DNS reste
          # partielle — un contrôle externe testerait une résolution encore instable plutôt
          # que le déploiement lui-même.
          #
          # On interroge le nom public depuis le serveur, et non 127.0.0.1 : le vhost n'écoute
          # pas sur la boucle locale, qui renvoie 404 même quand le site est parfaitement sain.
          #
          # En HTTPS : le contrôle valide ainsi le certificat en même temps que le site.
          #
          # En passant par la boucle locale avec l'en-tête Host, on teste exactement ce qui
          # vient d'être déployé. À rebasculer sur une adresse publique une fois le DNS migré.
          ssh cible "for tentative in 1 2 3 4 5; do
            code=\$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 \
              https://arquanzia.site/healthz || echo 000)
            echo \"Tentative \$tentative → HTTP \$code\"
            [ \"\$code\" = '200' ] && exit 0
            sleep 8
          done
          echo 'Le site déployé ne répond pas 200 depuis le serveur lui-même.'
          exit 1"
