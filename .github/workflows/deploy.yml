name: Déploiement

on:
  push:
    branches: [main]
  workflow_dispatch:

# Un seul déploiement à la fois, et on ne l'annule jamais en cours de route : couper un
# rsync ou une migration à mi-parcours laisserait le serveur dans un état incohérent.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    name: Tests et style
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Déployer en production
    needs: test
    runs-on: ubuntu-latest
    # Pour exiger une approbation manuelle avant chaque mise en production, créer un
    # environnement « production » dans les réglages du dépôt et ajouter ici :
    #   environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Préparer la connexion SSH
        env:
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          # Un alias décrit la cible une bonne fois : les étapes suivantes n'ont plus à
          # répéter les options, et ne peuvent plus diverger entre elles.
          #
          # IdentitiesOnly est le point décisif. L'option -i *ajoute* une clé à la liste des
          # identités proposées, elle n'y restreint pas : le client offrait aussi les clés
          # par défaut et celles de l'agent, et le serveur coupait la connexion à sa limite
          # MaxAuthTries avec « Too many authentication failures ».
          cat > ~/.ssh/config <<EOF
          Host cible
            HostName $SSH_HOST
            User $SSH_USER
            Port $SSH_PORT
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            BatchMode yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Vérifier l'accès au serveur
        # Étape de diagnostic : sans elle, un problème d'authentification se manifeste au
        # milieu d'un rsync et son message se perd dans la sortie du transfert.
        run: ssh cible 'echo "Connexion SSH établie sur $(hostname)"'

      - name: Synchroniser les fichiers
        env:
          REMOTE_DIR: ${{ secrets.DEPLOY_PATH }}
        run: |
          rsync -az --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='node_modules' \
            --exclude='vendor' \
            --exclude='storage' \
            --exclude='bootstrap/cache' \
            --exclude='tests' \
            --exclude='.DS_Store' \
            --exclude='sync-watch.sh' \
            arquanzia-backend/ "cible:$REMOTE_DIR/"

      - name: Installer les dépendances, migrer et régénérer les caches
        env:
          REMOTE_DIR: ${{ secrets.DEPLOY_PATH }}
          PHP_BIN: ${{ secrets.DEPLOY_PHP_BIN }}
        run: |
          ssh cible \
            "set -e
             cd '$REMOTE_DIR'

             # Impératif AVANT composer : les caches de découverte listent les service
             # providers des paquets installés. Quand un paquet disparaît du composer.lock,
             # Laravel tente quand même de charger le sien pendant la désinstallation, ne le
             # trouve plus, et interrompt tout. Ces fichiers sont tous régénérés plus bas.
             rm -f bootstrap/cache/*.php

             '$PHP_BIN' \$(which composer) install --no-dev --optimize-autoloader --no-interaction
             '$PHP_BIN' artisan migrate --force
             '$PHP_BIN' artisan view:clear
             '$PHP_BIN' artisan cache:clear
             '$PHP_BIN' artisan config:cache
             '$PHP_BIN' artisan route:cache
             chmod -R 775 storage bootstrap/cache"

      - name: Vérifier que le site répond
        env:
          HEALTH_URL: ${{ secrets.DEPLOY_HEALTH_URL }}
        run: |
          # Le serveur ne prend pas le nouveau cache de routes instantanément : une
          # vérification tirée dans la seconde qui suit route:cache peut voir une 404 alors
          # que le déploiement est correct. On laisse donc au serveur le temps de reprendre
          # la main, plutôt que d'échouer sur une course perdue d'avance.
          # Un agent utilisateur explicite : certains hébergements mutualisés filtrent ou
          # dévient les requêtes portant l'agent par défaut de curl, ce qui produit une 404
          # trompeuse alors que le site est sain.
          AGENT='Arquanzia-Deploy-Healthcheck/1.0 (+https://github.com/Morialkar/Arquanzia-Site)'

          for tentative in 1 2 3 4 5; do
            code=$(curl -sSL -A "$AGENT" -o /dev/null -w '%{http_code}' --max-time 30 "$HEALTH_URL" || echo 000)
            echo "Tentative $tentative → HTTP $code"

            if [ "$code" = "200" ]; then
              echo "Le site répond, déploiement confirmé."
              exit 0
            fi

            sleep 10
          done

          echo
          echo "Le site n'a pas répondu 200 après 5 tentatives."
          echo "En-têtes de la dernière réponse, pour distinguer une route absente d'un blocage :"
          curl -sSIL -A "$AGENT" --max-time 30 "$HEALTH_URL" | head -20 || true
          exit 1
